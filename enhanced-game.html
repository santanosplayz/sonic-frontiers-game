<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonic Frontiers - Enhanced</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}body{font-family:'Arial',sans-serif;background:#1a1a1a;color:#fff;overflow:hidden}#gameContainer{width:100vw;height:100vh;position:relative}#canvas{display:block;width:100%;height:100%;background:#87ceeb}.hud{position:absolute;top:20px;left:20px;font-size:16px;z-index:100;background:rgba(0,0,0,0.7);padding:10px 15px;border-radius:5px;border-left:3px solid #00d4ff}.hud-item{margin:8px 0;font-size:14px}.level-select{position:absolute;top:20px;right:20px;z-index:200;background:rgba(0,0,0,0.85);padding:12px;border-radius:8px;border:2px solid #00d4ff;max-height:75vh;overflow-y:auto;width:140px;max-height:300px}.level-btn{background:#0066cc;color:#fff;border:none;padding:6px 8px;margin:3px 0;border-radius:4px;cursor:pointer;font-size:11px;width:100%;transition:all 0.2s}.level-btn:hover{background:#0052a3}.level-btn.active{background:#00d4ff;color:#000;font-weight:bold}.level-btn.boss{background:#ff6b6b;border:2px solid #fff}.level-btn.boss:hover{background:#ff5555}#controls{position:absolute;bottom:20px;left:20px;background:rgba(0,0,0,0.7);padding:10px 15px;border-radius:5px;border-left:3px solid #00d4ff;font-size:12px;z-index:100}#superMode{position:absolute;top:20px;left:250px;background:rgba(255,215,0,0.9);color:#000;padding:10px 15px;border-radius:5px;border:2px solid #ff6600;font-size:14px;font-weight:bold;z-index:100;display:none}#bossWarning{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.9);color:#ff6b6b;padding:30px 50px;border-radius:10px;border:3px solid #ff6b6b;font-size:32px;font-weight:bold;z-index:500;display:none;text-align:center}.star{position:absolute;width:20px;height:20px;color:#ffd700;font-size:20px}
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="canvas"></canvas>
        <div class="hud">
            <div class="hud-item">🎮 L: <span id="lv">1</span>/20</div>
            <div class="hud-item">💰 R: <span id="rc">0</span></div>
            <div class="hud-item">❤️ H: <span id="hp">100</span>%</div>
            <div class="hud-item">⚡ S: <span id="sp">0</span></div>
        </div>
        <div id="superMode">⭐ SUPER MODE! ⭐ (<span id="superTime">0</span>s)</div>
        <div class="level-select" id="ls"></div>
        <div id="controls">
            <div>⬆️⬅️⬇️➡️ Move</div>
            <div>SPACE Jump / Double Jump (Super)</div>
            <div>10 Rings = ⭐ Super Mode!</div>
            <div>Uses 1 ring/second</div>
        </div>
        <div id="bossWarning"></div>
    </div>

    <script>
        // ========================================
        // SONIC FRONTIERS - ENHANCED WITH BOSSES & SUPER MODE
        // ========================================

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const keys = {};
        
        const levels = [
            // Regular Levels (1-2)
            { name: 'Valley', color: '#2ecc71', isBoss: false },
            { name: 'Ocean', color: '#3498db', isBoss: false },
            // Boss 1 (3)
            { name: 'Boss: Dragon', color: '#e74c3c', isBoss: true },
            // Regular Levels (4-5)
            { name: 'Desert', color: '#e67e22', isBoss: false },
            { name: 'Mountains', color: '#9b59b6', isBoss: false },
            // Boss 2 (6)
            { name: 'Boss: Golem', color: '#95a5a6', isBoss: true },
            // Regular Levels (7-8)
            { name: 'Caverns', color: '#34495e', isBoss: false },
            { name: 'Crystals', color: '#1abc9c', isBoss: false },
            // Boss 3 (9)
            { name: 'Boss: Phantom', color: '#8e44ad', isBoss: true },
            // Regular Levels (10-11)
            { name: 'Abyss', color: '#2c3e50', isBoss: false },
            { name: 'Temple', color: '#f39c12', isBoss: false },
            // Boss 4 (12)
            { name: 'Boss: Mech', color: '#c0392b', isBoss: true },
            // Regular Levels (13-14)
            { name: 'Peak', color: '#bdc3c7', isBoss: false },
            { name: 'Paradise', color: '#ff69b4', isBoss: false },
            // Boss 5 (15)
            { name: 'Boss: Shadow', color: '#000', isBoss: true },
            // Regular Levels (16-17)
            { name: 'Nebula', color: '#3498db', isBoss: false },
            { name: 'Aurora', color: '#16a085', isBoss: false },
            // Boss 6 (18)
            { name: 'Boss: Chaos', color: '#d35400', isBoss: true },
            // Regular Levels (19-20)
            { name: 'Final Zone', color: '#2ecc71', isBoss: false },
            { name: 'Infinity', color: '#9b59b6', isBoss: false }
        ];

        let currentLevel = 0;
        let gameState = {
            player: { x: 400, y: 300, vx: 0, vy: 0, jumping: false, doubleJumpUsed: false, health: 100, rings: 0, superMode: false, ringConsumptionTimer: 0 },
            platforms: [],
            enemies: [],
            rings: [],
            goal: null,
            boss: null,
            particles: []
        };

        const gravity = 0.3;
        const moveSpeed = 5;
        const jumpPower = 15;
        const superJumpPower = 12;
        const superModeGlide = 0.15;
        const ringConsumptionRate = 60; // 1 ring per 60 frames (1 second at 60fps)

        // ========================================
        // GAME INITIALIZATION
        // ========================================

        function init() {
            setupUI();
            loadLevel(0);
            setupEventListeners();
            gameLoop();
        }

        function setupUI() {
            const ls = document.getElementById('ls');
            levels.forEach((level, i) => {
                const btn = document.createElement('button');
                btn.textContent = level.isBoss ? `B${Math.ceil((i+1)/2)}` : `L${i + 1}`;
                btn.className = 'level-btn' + (level.isBoss ? ' boss' : '');
                if (i === 0) btn.classList.add('active');
                btn.onclick = () => loadLevel(i);
                ls.appendChild(btn);
            });
        }

        function loadLevel(levelIndex) {
            currentLevel = levelIndex;
            const level = levels[levelIndex];
            const levelColor = level.color;

            gameState.player = { x: 400, y: 300, vx: 0, vy: 0, jumping: false, doubleJumpUsed: false, health: 100, rings: gameState.player.rings, superMode: false, ringConsumptionTimer: 0 };
            gameState.platforms = [];
            gameState.enemies = [];
            gameState.rings = [];
            gameState.boss = null;
            gameState.particles = [];

            // Show boss warning
            if (level.isBoss) {
                showBossWarning(level.name);
            }

            // Generate platforms
            gameState.platforms.push({ x: 0, y: canvas.height - 50, w: canvas.width, h: 50, color: levelColor });

            if (level.isBoss) {
                // Boss level - fewer platforms
                for (let i = 0; i < 6; i++) {
                    gameState.platforms.push({
                        x: Math.random() * (canvas.width - 80),
                        y: 100 + Math.random() * (canvas.height - 200),
                        w: 80,
                        h: 20,
                        color: '#fff'
                    });
                }
                // Create boss
                gameState.boss = {
                    x: canvas.width - 150,
                    y: 200,
                    vx: -3,
                    vy: 0,
                    health: 50,
                    maxHealth: 50,
                    shootTimer: 0
                };
            } else {
                // Regular level
                for (let i = 0; i < 8 + levelIndex; i++) {
                    gameState.platforms.push({
                        x: Math.random() * (canvas.width - 80),
                        y: 100 + Math.random() * (canvas.height - 200),
                        w: 80,
                        h: 20,
                        color: '#fff'
                    });
                }

                // Generate rings (more if not super mode yet)
                for (let i = 0; i < 25 + levelIndex * 5; i++) {
                    gameState.rings.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * (canvas.height - 100),
                        collected: false
                    });
                }

                // Generate enemies (fewer on earlier levels)
                for (let i = 0; i < Math.max(1, Math.floor(levelIndex / 4)); i++) {
                    gameState.enemies.push({
                        x: Math.random() * canvas.width,
                        y: 200 + Math.random() * 200,
                        vx: (Math.random() - 0.5) * 3,
                        vy: 0,
                        health: 30
                    });
                }
            }

            // Goal
            gameState.goal = { x: canvas.width - 100, y: 200, reached: false };

            updateUI();
        }

        function showBossWarning(bossName) {
            const warning = document.getElementById('bossWarning');
            warning.textContent = `⚠️ ${bossName} ⚠️`;
            warning.style.display = 'block';
            setTimeout(() => {
                warning.style.display = 'none';
            }, 2000);
        }

        function updateUI() {
            document.getElementById('lv').textContent = currentLevel + 1;
            document.getElementById('rc').textContent = gameState.player.rings;
            document.getElementById('hp').textContent = gameState.player.health;
            document.getElementById('sp').textContent = Math.floor(Math.sqrt(gameState.player.vx ** 2 + gameState.player.vy ** 2));

            // Show super mode indicator
            const superIndicator = document.getElementById('superMode');
            if (gameState.player.superMode) {
                superIndicator.style.display = 'block';
                const timeRemaining = Math.ceil(gameState.player.rings);
                document.getElementById('superTime').textContent = timeRemaining;
            } else {
                superIndicator.style.display = 'none';
            }

            document.querySelectorAll('.level-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === currentLevel);
            });
        }

        // ========================================
        // GAME LOGIC
        // ========================================

        function updatePlayer() {
            // Movement
            gameState.player.vx = 0;
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) gameState.player.vx = -moveSpeed;
            if (keys['ArrowRight'] || keys['d'] || keys['D']) gameState.player.vx = moveSpeed;

            // Apply gravity (reduced in super mode)
            const currentGravity = gameState.player.superMode ? gravity * superModeGlide : gravity;
            gameState.player.vy += currentGravity;
            gameState.player.x += gameState.player.vx;
            gameState.player.y += gameState.player.vy;

            // Platform collision
            let onPlatform = false;
            gameState.platforms.forEach(platform => {
                if (
                    gameState.player.x + 15 > platform.x &&
                    gameState.player.x - 15 < platform.x + platform.w &&
                    gameState.player.y + 15 > platform.y &&
                    gameState.player.y + 15 < platform.y + platform.h &&
                    gameState.player.vy >= 0
                ) {
                    gameState.player.y = platform.y - 15;
                    gameState.player.vy = 0;
                    gameState.player.jumping = false;
                    gameState.player.doubleJumpUsed = false;
                    onPlatform = true;
                }
            });

            // Jump
            if ((keys[' '] || keys['ArrowUp'] || keys['w'] || keys['W']) && !gameState.player.jumping) {
                gameState.player.vy = -jumpPower;
                gameState.player.jumping = true;
            }

            // Double jump (Super Mode only)
            if ((keys[' '] || keys['ArrowUp'] || keys['w'] || keys['W']) && gameState.player.jumping && gameState.player.superMode && !gameState.player.doubleJumpUsed) {
                gameState.player.vy = -superJumpPower;
                gameState.player.doubleJumpUsed = true;
                createParticles(gameState.player.x, gameState.player.y, '#ffd700', 10);
            }

            // Boundary check
            if (gameState.player.x < 0) gameState.player.x = 0;
            if (gameState.player.x > canvas.width) gameState.player.x = canvas.width;

            // Fall off world
            if (gameState.player.y > canvas.height) {
                loadLevel(currentLevel);
            }

            // Check if can go super
            if (gameState.player.rings >= 10 && !gameState.player.superMode) {
                gameState.player.superMode = true;
                gameState.player.rings = 10; // Start with exactly 10 rings
                gameState.player.ringConsumptionTimer = 0;
            }

            // Super Mode ring consumption (1 ring per second)
            if (gameState.player.superMode) {
                gameState.player.ringConsumptionTimer++;
                if (gameState.player.ringConsumptionTimer >= ringConsumptionRate) {
                    gameState.player.rings -= 1;
                    gameState.player.ringConsumptionTimer = 0;
                    
                    if (gameState.player.rings <= 0) {
                        gameState.player.superMode = false;
                        gameState.player.rings = 0;
                    }
                }
            }
        }

        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                gameState.particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8 - 2,
                    life: 30,
                    color: color
                });
            }
        }

        function updateParticles() {
            gameState.particles = gameState.particles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.1;
                p.life--;
                return p.life > 0;
            });
        }

        function updateEnemies() {
            gameState.enemies.forEach(enemy => {
                enemy.x += enemy.vx;
                enemy.y += enemy.vy;

                // Bounce
                if (enemy.x < 0 || enemy.x > canvas.width) enemy.vx *= -1;

                // Check collision with player
                const dx = gameState.player.x - enemy.x;
                const dy = gameState.player.y - enemy.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < 30) {
                    if (gameState.player.superMode) {
                        // Destroy enemy
                        enemy.health = 0;
                        createParticles(enemy.x, enemy.y, '#ff0000', 15);
                    } else {
                        gameState.player.health -= 10;
                        gameState.player.y -= 50;
                        if (gameState.player.health <= 0) {
                            loadLevel(currentLevel);
                        }
                    }
                }
            });

            gameState.enemies = gameState.enemies.filter(e => e.health > 0);
        }

        function updateBoss() {
            if (!gameState.boss) return;

            const boss = gameState.boss;

            // Boss movement
            boss.x += boss.vx;
            boss.y += boss.vy;

            // Bounce around
            if (boss.x < 100) boss.vx = 2;
            if (boss.x > canvas.width - 100) boss.vx = -2;
            if (boss.y < 100) boss.vy = 2;
            if (boss.y > canvas.height - 150) boss.vy = -2;

            boss.shootTimer++;

            // Boss shoots projectiles
            if (boss.shootTimer > 30) {
                const angle = Math.atan2(gameState.player.y - boss.y, gameState.player.x - boss.x);
                gameState.enemies.push({
                    x: boss.x,
                    y: boss.y,
                    vx: Math.cos(angle) * 4,
                    vy: Math.sin(angle) * 4,
                    health: 5,
                    isBullet: true
                });
                boss.shootTimer = 0;
            }

            // Check collision with player
            const dx = gameState.player.x - boss.x;
            const dy = gameState.player.y - boss.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < 40) {
                if (gameState.player.superMode) {
                    boss.health -= 2;
                    createParticles(boss.x, boss.y, '#ff6b6b', 10);
                    gameState.player.y -= 30;
                } else {
                    gameState.player.health -= 15;
                    gameState.player.y -= 50;
                    if (gameState.player.health <= 0) {
                        loadLevel(currentLevel);
                    }
                }
            }

            // Boss defeated
            if (boss.health <= 0) {
                gameState.goal.reached = true;
                gameState.player.rings += 50;
                createParticles(boss.x, boss.y, '#ffd700', 30);
            }
        }

        function updateRings() {
            gameState.rings.forEach(ring => {
                if (!ring.collected) {
                    const dx = gameState.player.x - ring.x;
                    const dy = gameState.player.y - ring.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 25) {
                        ring.collected = true;
                        gameState.player.rings += 1;
                        createParticles(ring.x, ring.y, '#ffd700', 5);
                    }
                }
            });
        }

        function checkGoal() {
            if (!gameState.goal.reached) {
                const dx = gameState.player.x - gameState.goal.x;
                const dy = gameState.player.y - gameState.goal.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < 40) {
                    gameState.goal.reached = true;
                    gameState.player.superMode = false;
                    setTimeout(() => {
                        loadLevel((currentLevel + 1) % levels.length);
                    }, 1000);
                }
            }
        }

        // ========================================
        // RENDERING
        // ========================================

        function drawPlayer() {
            ctx.save();

            if (gameState.player.superMode) {
                // Draw golden aura
                ctx.fillStyle = 'rgba(255, 215, 0, 0.3)';
                ctx.beginPath();
                ctx.arc(gameState.player.x, gameState.player.y, 40, 0, Math.PI * 2);
                ctx.fill();

                // Draw stars around player
                for (let i = 0; i < 4; i++) {
                    const angle = (i / 4) * Math.PI * 2;
                    const sx = gameState.player.x + Math.cos(angle) * 35;
                    const sy = gameState.player.y + Math.sin(angle) * 35;
                    ctx.fillStyle = '#ffd700';
                    ctx.font = 'bold 20px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('⭐', sx, sy);
                }
            }

            // Draw player
            ctx.fillStyle = gameState.player.superMode ? '#ffff00' : '#0099ff';
            ctx.fillRect(gameState.player.x - 15, gameState.player.y - 15, 30, 30);
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.strokeRect(gameState.player.x - 15, gameState.player.y - 15, 30, 30);

            // Draw eyes
            ctx.fillStyle = '#fff';
            ctx.fillRect(gameState.player.x - 8, gameState.player.y - 8, 6, 6);
            ctx.fillRect(gameState.player.x + 2, gameState.player.y - 8, 6, 6);

            ctx.restore();
        }

        function drawBoss() {
            if (!gameState.boss) return;

            const boss = gameState.boss;

            // Draw boss health bar
            ctx.fillStyle = '#000';
            ctx.fillRect(boss.x - 40, boss.y - 50, 80, 10);
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(boss.x - 40, boss.y - 50, (boss.health / boss.maxHealth) * 80, 10);
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.strokeRect(boss.x - 40, boss.y - 50, 80, 10);

            // Draw boss
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(boss.x - 30, boss.y - 30, 60, 60);
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 3;
            ctx.strokeRect(boss.x - 30, boss.y - 30, 60, 60);

            // Draw eyes
            ctx.fillStyle = '#ffff00';
            ctx.fillRect(boss.x - 15, boss.y - 15, 8, 8);
            ctx.fillRect(boss.x + 7, boss.y - 15, 8, 8);
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = '#87ceeb';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw platforms
            gameState.platforms.forEach(platform => {
                ctx.fillStyle = platform.color;
                ctx.fillRect(platform.x, platform.y, platform.w, platform.h);
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.strokeRect(platform.x, platform.y, platform.w, platform.h);
            });

            // Draw rings
            gameState.rings.forEach(ring => {
                if (!ring.collected) {
                    ctx.fillStyle = '#ffd700';
                    ctx.beginPath();
                    ctx.arc(ring.x, ring.y, 8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            });

            // Draw enemies
            ctx.fillStyle = '#ff0000';
            gameState.enemies.forEach(enemy => {
                if (enemy.isBullet) {
                    ctx.fillStyle = '#ff6b6b';
                    ctx.beginPath();
                    ctx.arc(enemy.x, enemy.y, 6, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillRect(enemy.x - 15, enemy.y - 15, 30, 30);
                }
            });

            // Draw boss
            drawBoss();

            // Draw particles
            gameState.particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / 30;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            });

            // Draw goal
            if (!gameState.goal.reached) {
                ctx.fillStyle = '#00ff00';
                ctx.beginPath();
                ctx.arc(gameState.goal.x, gameState.goal.y, 25, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.fillStyle = '#000';
                ctx.font = 'bold 20px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🚩', gameState.goal.x, gameState.goal.y);
            }

            // Draw player
            drawPlayer();
        }

        // ========================================
        // GAME LOOP
        // ========================================

        function gameLoop() {
            updatePlayer();
            updateEnemies();
            updateBoss();
            updateRings();
            updateParticles();
            checkGoal();
            updateUI();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // ========================================
        // EVENT LISTENERS
        // ========================================

        function setupEventListeners() {
            window.addEventListener('keydown', (e) => {
                keys[e.key] = true;
            });

            window.addEventListener('keyup', (e) => {
                keys[e.key] = false;
            });

            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            });
        }

        // Start game
        window.addEventListener('load', init);
    </script>
</body>
</html>
